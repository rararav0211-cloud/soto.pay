<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑都ペイ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="top-bar">
    <span class="logo-text">桑都ペイ</span>
    <button class="notification-btn" aria-label="お知らせ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="balance-card">
      <div class="card-label">使用可能金額</div>
      <div class="card-amount">
        <span class="amount-value">4,000</span>
        <span class="amount-unit">円</span>
      </div>
      <!-- 保有ポイント（数字は js/state.js で書きかわる） -->
      <p class="card-points">保有ポイント <span class="points-value">0</span>pt</p>
      <div class="card-actions">
        <a href="pay.html" class="action-btn primary pay-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M2 10h20"/>
          </svg>
          支払う
        </a>
        <button class="action-btn secondary charge-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12l7-7 7 7"/>
          </svg>
          チャージ
        </button>
        <button class="action-btn secondary history-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          取引履歴
        </button>
      </div>
    </section>

    <section class="services">
      <a href="shops.html" class="service-item">
        <div class="service-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span>加盟店一覧</span>
      </a>
      <a href="coupons.html" class="service-item">
        <div class="service-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </div>
        <span>クーポン</span>
      </a>
      <a href="stamp.html" class="service-item">
        <div class="service-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="6"/>
            <polyline points="9 8 11 10 15 6"/>
            <path d="M8.2 13.3L7 22l5-3 5 3-1.2-8.7"/>
          </svg>
        </div>
        <span>スタンプラリー</span>
      </a>
    </section>

    <section class="reserve">
      <h2 class="reserve-title">お店を予約</h2>
      <div class="reserve-buttons">
        <a href="reserve.html?type=food" class="reserve-btn">
          <svg class="reserve-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
            <path d="M7 2v20"/>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
          </svg>
          食べる
        </a>
        <a href="reserve.html?type=stay" class="reserve-btn">
          <svg class="reserve-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4v16"/>
            <path d="M2 8h18a2 2 0 0 1 2 2v10"/>
            <path d="M2 17h20"/>
            <path d="M6 8v9"/>
          </svg>
          泊まる
        </a>
        <a href="reserve.html?type=experience" class="reserve-btn">
          <svg class="reserve-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          体験する
        </a>
      </div>
    </section>

    <section class="coupon">
      <div class="coupon-header">
        <h2>おトクなクーポン</h2>
        <a href="coupons.html" class="news-more">すべて見る</a>
      </div>
      <!-- 回遊クーポンの案内は js/ui-coupon.js で自動生成 -->
      <div class="tour-banner"></div>
      <div class="coupon-carousel">
        <!-- クーポンは js/page-home.js で自動生成 -->
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>ホーム</span>
    </button>
    <a href="shops.html?sort=near" class="nav-item nav-near">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>近くのお店</span>
    </a>
    <a href="pay.html" class="nav-item pay-nav">
      <div class="pay-circle">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M2 10h20"/>
        </svg>
      </div>
      <span>支払う</span>
    </a>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>アカウント</span>
    </button>
  </nav>
<!-- 読み込む順番を変えないでください（上のファイルを下のファイルが使います） -->
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/state.js"></script>
<script src="js/demo.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/ui-coupon.js"></script>
<script src="js/ui-merchant.js"></script>
<script src="js/ui-pay.js"></script>
<script src="js/page-home.js"></script>
</body>
</html>
