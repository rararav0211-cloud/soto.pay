<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタンプラリー｜桑都ペイ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="top-bar sub-bar">
    <a href="index.html" class="back-btn" aria-label="ホームに戻る">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 class="page-title">スタンプラリー</h1>
    <button class="notification-btn" aria-label="お知らせ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </header>

  <!-- 中身はすべて js/page-stamp.js で自動生成 -->
  <main class="stamp-page">
    <section class="stamp-hero"></section>

    <section class="stamp-section">
      <h2 class="stamp-section-title">スタンプカード</h2>
      <div class="stamp-card"></div>
    </section>

    <section class="stamp-section">
      <h2 class="stamp-section-title">特典</h2>
      <div class="stamp-rewards"></div>
    </section>

    <section class="stamp-section">
      <h2 class="stamp-section-title">対象のお店</h2>
      <p class="stamp-section-note">お店を押すと詳細が開きます。お店で桑都ペイを使うとスタンプが押されます。</p>
      <div class="stamp-spots"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>ホーム</span>
    </a>
    <a href="shops.html?sort=near" class="nav-item nav-near">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>近くのお店</span>
    </a>
    <a href="pay.html" class="nav-item pay-nav">
      <div class="pay-circle">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M2 10h20"/>
        </svg>
      </div>
      <span>支払う</span>
    </a>
    <button class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>アカウント</span>
    </button>
  </nav>
<!-- 読み込む順番を変えないでください（上のファイルを下のファイルが使います） -->
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/state.js"></script>
<script src="js/demo.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/ui-coupon.js"></script>
<script src="js/ui-merchant.js"></script>
<script src="js/ui-pay.js"></script>
<script src="js/page-stamp.js"></script>
</body>
</html>
